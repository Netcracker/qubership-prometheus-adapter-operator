---
name: "Tests: Go test with Sonar"
run-name: "Ref: ${{ github.ref_name }}. On ${{ github.event_name }}"

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - name: Checkout push
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Go changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            go:
              - '.github/workflows/test-sonar-go-coverage.yaml'
              - '.github/config/build-config.yaml'
              - 'api/**'
              - 'controllers/**'
              - 'integration-tests/**'
              - 'main.go'
              - 'go.*'
              - 'Makefile'

  prepare:
    needs: changes
    if: needs.changes.outputs.go != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sonar-project-key: ${{ steps.config.outputs.sonar-project-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve sonar project key based on restricted actors
        id: config
        env:
          ACTOR: ${{ github.actor }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          restricted=$(python3 -c "
          import yaml, os
          with open('.github/config/build-config.yaml') as f:
              config = yaml.safe_load(f)
          actors = config.get('restricted-actors', [])
          current_actors = [os.environ['ACTOR'], os.environ.get('PR_AUTHOR', '')]
          print('true' if any(actor in actors for actor in current_actors) else 'false')
          ")
          if [ "$restricted" = "true" ]; then
            echo "sonar-project-key=" >> "$GITHUB_OUTPUT"
          else
            echo "sonar-project-key=${SONAR_PROJECT_KEY}" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: prepare
    name: Build and test with coverage
    uses: netcracker/qubership-core-infra/.github/workflows/generic-go-build.yaml@71206242f5967ac6691337913593f8623863f711 # v2.5.2
    with:
      sonar-project-key: ${{ needs.prepare.outputs.sonar-project-key }}
      install-envtest: true
      kube-version: '1.32.0'
      envtest-version: 'release-0.23'
      skip-docker: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      contents: read
      pull-requests: write
      packages: write

  go-ci-gate:
    name: Go CI Gate
    needs: [changes, prepare, test]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require Go validation when applicable
        if: >-
          needs.changes.result != 'success' ||
          (needs.changes.outputs.go != 'false' &&
          (needs.prepare.result != 'success' ||
          needs.test.result != 'success'))
        run: exit 1
